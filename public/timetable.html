<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MBA – Trimester III Timetable</title>

<style>
body { font-family: Arial, sans-serif; }
.header { display:grid; grid-template-columns:120px auto 120px; align-items:center; }
.header img { height:80px; }
.header-center { text-align:center; }

.instructions {
  border:1px solid #000;
  padding:10px;
  margin:10px;
  background:#f9f9f9;
}

table { border-collapse:collapse; width:100%; }
th, td { border:1px solid #000; padding:6px; text-align:center; }

.core { font-weight:bold; }
</style>
</head>

<body>

<div class="header">
  <img src="/trim-3-timetable/images/NITT LOGO.png">
  <div class="header-center">
    <h2>NATIONAL INSTITUTE OF TECHNOLOGY</h2>
    <h3>DEPARTMENT OF MANAGEMENT STUDIES</h3>
    <h4>MBA – TRIMESTER III</h4>
  </div>
  <img src="/trim-3-timetable/images/DoMS LOGO NITT.png">
</div>

<div id="instructions" class="instructions"></div>

<table>
<thead>
<tr>
<th>Day / Time</th>
<th>08:30–09:20</th>
<th>09:20–10:10</th>
<th>10:30–11:20</th>
<th>11:20–12:10</th>
<th>01:30–02:20</th>
<th>02:20–03:10</th>
<th>03:30–04:20</th>
<th>04:20–05:10</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const TIMES = [
 "08:30-09:20","09:20-10:10","10:30-11:20","11:20-12:10",
 "01:30-02:20","02:20-03:10","03:30-04:20","04:20-05:10"
];

fetch("/trim-3-timetable/data/timetable.json")
  .then(r => r.json())
  .then(data => init(data));

function init(data) {
  const tbody = document.getElementById("tbody");

  document.getElementById("instructions").innerHTML =
    "<b>Instructions:</b><ul>" +
    data.instructions.map(i => `<li>${i}</li>`).join("") +
    "</ul>";

  DAYS.forEach(d => {
    let row = `<tr><td>${d}</td>`;
    TIMES.forEach(t => {
      const cls = data.base.find(b => b.day===d && b.time===t);
      row += `<td>${cls ? `<div class="core">${cls.subject}</div>` : ""}</td>`;
    });
    tbody.innerHTML += row + "</tr>";
  });
}
</script>

</body>
</html>
