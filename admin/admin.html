<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ADMIN – MBA Trimester III</title>

<style>
body { font-family: Arial, sans-serif; }
.hidden { display:none; }
fieldset { border:1px solid #000; padding:10px; margin:15px 0; }
label { display:inline-block; width:120px; }
button { padding:6px 12px; margin:5px; }
.warning { color:red; font-weight:bold; }
pre { background:#f5f5f5; padding:10px; }
</style>
</head>

<body>

<h2>ADMIN PANEL – MBA TRIMESTER III</h2>
<p class="warning">⚠ This page is NOT public. Download JSON and upload manually.</p>

<div id="loginBox">
  Password:
  <input type="password" id="pwd">
  <button onclick="login()">Login</button>
</div>

<div id="adminUI" class="hidden">

<fieldset>
<legend>Session</legend>

<label>Date</label>
<input type="date" id="date"><br><br>

<label>Day</label>
<input type="text" id="day" disabled><br><br>

<label>Time</label>
<select id="time">
<option>08:30-09:20</option>
<option>09:20-10:10</option>
<option>10:30-11:20</option>
<option>11:20-12:10</option>
<option>01:30-02:20</option>
<option>02:20-03:10</option>
<option>03:30-04:20</option>
<option>04:20-05:10</option>
</select><br><br>

<label>Subject</label>
<select id="subject">
<option>HRM</option><option>ISM</option><option>POM</option>
<option>FM</option><option>BRM</option><option>IE</option>
<option>DM</option><option>FIS</option><option>SCM</option>
<option>IBA</option>
</select><br><br>

<label>Venue</label>
<select id="venue">
<option>LH 1</option><option>LH 2</option>
<option>LH 4</option><option>LH 5</option>
<option>Computer Lab</option>
</select>
</fieldset>

<button onclick="addOverride()">➕ Add / Replace</button>
<button onclick="removeOverride()">❌ Remove</button>
<button onclick="downloadJSON()">⬇ Download timetable.json</button>

<h4>Preview</h4>
<pre id="preview"></pre>

</div>

<script>
const ADMIN_PASSWORD = "ADMIN@DoMS";
const DAY_MAP = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let overrides = [];

function login() {
  if (pwd.value === ADMIN_PASSWORD) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminUI").classList.remove("hidden");
  } else {
    alert("Wrong password");
  }
}

date.onchange = () => {
  const d = new Date(date.value);
  day.value = DAY_MAP[d.getDay()];
};

function addOverride() {
  overrides = overrides.filter(o => !(o.date===date.value && o.time===time.value));
  overrides.push({
    date: date.value,
    day: day.value,
    time: time.value,
    action: "replace",
    subject: subject.value,
    venue: venue.value
  });
  refresh();
}

function removeOverride() {
  overrides = overrides.filter(o => !(o.date===date.value && o.time===time.value));
  overrides.push({
    date: date.value,
    day: day.value,
    time: time.value,
    action: "remove"
  });
  refresh();
}

function refresh() {
  preview.textContent = JSON.stringify(overrides, null, 2);
}

function downloadJSON() {
  const data = { overrides };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "timetable.json";
  a.click();
}
</script>

</body>
</html>
